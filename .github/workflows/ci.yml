name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Select a short isolated environment path
        shell: bash
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/eovr" >> "$GITHUB_ENV"
      - run: python -m pip install uv==0.12.9
      - run: uv sync --locked --extra dev --extra geo --extra search --extra pca
      - run: uv run --locked --no-sync python -m ruff check .
      - run: uv run --locked --no-sync python -m mypy
      - run: uv run --locked --no-sync python -m pytest --cov=eo_visual_retrieval --cov-report=term-missing --cov-fail-under=75
      - run: uv pip check --python "${{ env.UV_PROJECT_ENVIRONMENT }}"

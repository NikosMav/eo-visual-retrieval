name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/eovr
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.9
      - run: uv sync --locked --extra dev --extra geo --extra search
      - run: uv run --locked --no-sync python -m ruff check .
      - run: uv run --locked --no-sync python -m pytest --cov=eo_visual_retrieval --cov-report=term-missing
      - run: uv pip check --python "${{ env.UV_PROJECT_ENVIRONMENT }}"

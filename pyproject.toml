[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eo-visual-retrieval"
version = "0.1.0"
description = "STAC-aware Earth-observation retrieval with RGB and multispectral embeddings."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE.md" }
authors = [{ name = "Nikos Mavrapidis" }]
keywords = ["earth-observation", "stac", "retrieval", "dinov2", "ssl4eo", "pca"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
stac = [
  "planetary-computer>=1.0,<2",
  "pystac-client>=0.8,<1",
  "requests>=2.31,<3",
]
geo = [
  "rasterio>=1.4,<2",
]
ml = [
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]
search = [
  "faiss-cpu>=1.15,<2",
  "psutil>=7,<8",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
eovr = "eo_visual_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_visual_retrieval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:rasterio\\..*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

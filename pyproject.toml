[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eo-visual-retrieval"
version = "0.1.0"
description = "STAC-aware Earth-observation retrieval with RGB and multispectral embeddings."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE.md" }
authors = [{ name = "Nikos Mavrapidis" }]
keywords = ["earth-observation", "stac", "retrieval", "dinov2", "ssl4eo", "pca"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
stac = [
  "planetary-computer>=1.0,<2",
  "pystac-client>=0.8,<1",
  "requests>=2.31,<3",
]
geo = [
  "rasterio>=1.4,<2",
]
bigearthnet = ["pyarrow>=25.0.1,<26", "zstandard>=0.25,<1"]
pca = ["scikit-learn>=1.4,<2"]
multimodal = [
  "open-clip-torch==3.3.0",
  "huggingface-hub>=0.34,<2",
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
]
ml = [
  "scikit-learn>=1.4,<2",
  "torch>=2.13,<2.14",
  "torchvision>=0.28,<0.29",
]
cpu = ["torch>=2.13,<2.14", "torchvision>=0.28,<0.29"]
cuda = ["torch>=2.13,<2.14", "torchvision>=0.28,<0.29"]
experiments = ["mlflow>=3,<4"]
foundation = ["terratorch>=1.2.4,<2"]
search = [
  "faiss-cpu>=1.15,<2",
  "psutil>=7,<8",
]
app = [
  "fastapi>=0.115,<1",
  "starlette>=0.40,<2",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]
browser = [
  "pytest>=9.0.3,<10",
  "pytest-playwright>=0.7,<1",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
eovr = "eo_visual_retrieval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_visual_retrieval"]

[tool.uv]
required-version = ">=0.12.9,<0.13"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
# 5.1.2 has no CPython 3.11 Windows wheel; avoid an unnecessary C++ compiler.
constraint-dependencies = ["stringzilla<5.1.2; sys_platform == 'win32' and python_version < '3.12'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:rasterio\\..*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Deliberately not pinned to one version: CI checks 3.11 and 3.12, and the
# installed dependency stubs are the ones for the interpreter running mypy.
files = ["src", "tests", "scripts"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Optional heavy dependencies are absent from the lightweight CI environment and
# several ship no type information. Missing stubs must not be reported as a
# failure of this repository's own annotations.
[[tool.mypy.overrides]]
module = [
  "open_clip.*",
  "huggingface_hub.*",
  "faiss.*",
  "mlflow.*",
  "planetary_computer.*",
  "playwright.*",
  "psutil.*",
  "pystac_client.*",
  "pyarrow.*",
  "rasterio.*",
  "requests.*",
  "sklearn.*",
  "terratorch.*",
  "torch.*",
  "torchvision.*",
]
ignore_missing_imports = true

# Run on demand with `uvx --from deptry==0.25.1 deptry src scripts`.
[tool.deptry]
optional_dependencies_dev_groups = ["dev", "browser"]

[tool.deptry.package_module_name_map]
Pillow = ["PIL"]
scikit-learn = ["sklearn"]
faiss-cpu = ["faiss"]

[tool.deptry.per_rule_ignores]
# FastAPI loads these optional integrations; neither needs a direct import here.
DEP002 = ["jinja2", "python-multipart"]
